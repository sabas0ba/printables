title = "Tang Primer 20K Dock LCD case"
summary = "Case for the Tang Primer 20K Dock with a 4.3-inch or 5-inch RGB LCD; printed snap pins, four M2.5 screws for the Dock, and a tool-less rear service cap for SODIMM and PMOD access."
prototype = true
added = 2026-10-12
lang = "ja"
source = "Python"
cover = "output/assembly_43.png"
pages = ["DESIGN_R4.md"]

# The quantities describe the 4.3-inch LCD; the 5-inch front shell and
# retainer replace the 4.3-inch ones (quantity 0).
[[parts]]
file = "stl/front_shell_43_snap.stl"
quantity = 1
description = "Front shell for the 4.3-inch LCD"

[[parts]]
