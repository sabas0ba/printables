title = "M5Stack StackChan hats"
summary = "Push-on cap for the K151 head, 35 plug-in decoration sets, 4 one-piece cap variants, 6 food drapes that dress the head itself as tofu, pudding or onigiri, and 11 house and food shells; support-free; clear of body and base over the full pitch range (shells: up to a per-shell look-up angle)."
prototype = true
added = 2026-10-04
lang = "ja"
source = "CadQuery"
cover = "images/catalogue.png"

