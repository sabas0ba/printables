title = "Tang Nano 9K LCD panel case"
summary = "Panel-mount case for the Tang Nano 9K with a 4.3-inch or 5-inch 40-pin RGB LCD; snap-fit LCD retainer and rear cover; USB-C, HDMI and microSD access."
prototype = true
added = 2026-10-12
lang = "ja"
source = "Python"
cover = "output/4p3in/images/assembly_render.png"
pages = ["docs/retention-design.md", "docs/development.md"]

# One set is a front chassis for the panel thickness, the LCD retainer and one
# rear cover. The quantities describe the 4.3-inch LCD in a 2.0 mm panel with
# the standard rear cover; every other file is an alternative (quantity 0).

