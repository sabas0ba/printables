name: Verify printables

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the pinned Nix container
        run: docker build -t printables-check .
      - name: Verify geometry and images without network access
        run: docker run --rm --network none printables-check
      - name: Run the site unit tests without network access
        run: >-
          docker run --rm --network none printables-check
          nix develop --offline --command
          /opt/printables-venv/bin/python -m unittest discover -s tests
      - name: Build and check the site without network access
        run: >-
          docker run --rm --network none -v "$RUNNER_TEMP/pages:/pages" printables-check
          nix develop --offline --command
          /opt/printables-venv/bin/python scripts/build_site.py --check --out /pages/site
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
