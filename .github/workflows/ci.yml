name: Verify printables

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the pinned Nix container
        run: docker build -t printables-check .
      - name: Generate the uv project lock candidate
        run: |
          mkdir -p .work
          docker run --rm -v "$PWD/.work:/out" printables-check \
            nix develop --offline --command sh -eu -c \
              'uv lock --python python3.12 && cp uv.lock /out/uv.lock'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uv-project-lock
          path: .work/uv.lock
      - name: Verify geometry and images without network access
        run: docker run --rm --network none printables-check
